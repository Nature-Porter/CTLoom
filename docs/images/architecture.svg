<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">CTLoom architecture</title>
  <desc id="desc">Terminal UI and model adapters connect to the Agent runtime. The runtime uses permission-controlled tools and MCP extensions, agent collaboration and worktrees, and context and memory services.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1280" height="660" rx="24" fill="#101622"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="48" y="53" fill="#67e8f9" font-size="12" font-weight="600" letter-spacing="2.5">HOW CTLOOM WORKS</text>
    <text x="48" y="95" fill="#f1f5f9" font-size="30" font-weight="600">One terminal. A complete coding loop.</text>
    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M300 220H367" marker-start="url(#arrow)"/>
      <path d="M904 220H971" marker-start="url(#arrow)"/>
      <path d="M640 304V355H248V394"/>
      <path d="M640 355H640V394"/>
      <path d="M640 355H1032V394"/>
    </g>
    <rect x="48" y="152" width="252" height="136" rx="14" fill="#172231" stroke="#334155"/>
    <text x="72" y="187" fill="#f1f5f9" font-size="20" font-weight="600">Terminal UI</text>
    <text x="72" y="221" fill="#94a3b8" font-size="16">Textual · slash commands</text>
    <text x="72" y="251" fill="#94a3b8" font-size="16">File refs · live tool output</text>
    <rect x="376" y="136" width="528" height="168" rx="16" fill="#211d39" stroke="#8b5cf6"/>
    <text x="406" y="175" fill="#ddd6fe" font-size="22" font-weight="600">Agent runtime</text>
    <text x="406" y="215" fill="#f1f5f9" font-size="20">Reason → call tools → observe → repeat</text>
    <text x="406" y="260" fill="#a5b4ce" font-size="16">ReAct loop · Plan Mode · streaming events</text>
    <rect x="980" y="136" width="252" height="168" rx="14" fill="#172231" stroke="#334155"/>
    <text x="1004" y="175" fill="#f1f5f9" font-size="20" font-weight="600">Model adapters</text>
    <text x="1004" y="214" fill="#94a3b8" font-size="16">Anthropic Messages</text>
    <text x="1004" y="245" fill="#94a3b8" font-size="16">OpenAI Responses</text>
    <text x="1004" y="276" fill="#94a3b8" font-size="16">Chat Completions</text>
    <rect x="48" y="404" width="368" height="188" rx="14" fill="#132a2e" stroke="#2e6b70"/>
    <text x="72" y="441" fill="#99f6e4" font-size="20" font-weight="600">Tools + extensions</text>
    <text x="72" y="478" fill="#cbd5e1" font-size="16">Read · write · edit · search · shell</text>
    <text x="72" y="508" fill="#cbd5e1" font-size="16">MCP discovery · Skills · Hooks</text>
    <rect x="72" y="533" width="320" height="35" rx="7" fill="#0f1e26"/>
    <text x="86" y="556" fill="#5eead4" font-size="14">Permission checks + optional OS sandbox</text>
    <rect x="456" y="404" width="368" height="188" rx="14" fill="#202238" stroke="#4d4d7d"/>
    <text x="480" y="441" fill="#c4b5fd" font-size="20" font-weight="600">Agents + collaboration</text>
    <text x="480" y="478" fill="#cbd5e1" font-size="16">Sub-agents · teams · task tracking</text>
    <text x="480" y="508" fill="#cbd5e1" font-size="16">Mailboxes · traces · coordination</text>
    <text x="480" y="555" fill="#a5b4ce" font-size="15">Git Worktrees for file isolation</text>
    <rect x="864" y="404" width="368" height="188" rx="14" fill="#2b251c" stroke="#76613c"/>
    <text x="888" y="441" fill="#f5d09a" font-size="20" font-weight="600">Context + persistence</text>
    <text x="888" y="478" fill="#cbd5e1" font-size="16">Large output persistence · compaction</text>
    <text x="888" y="508" fill="#cbd5e1" font-size="16">Instructions · memory · sessions</text>
    <text x="888" y="555" fill="#bcae96" font-size="15">Recall · resume · file checkpoints</text>
    <text x="48" y="632" fill="#64748b" font-size="13">Conceptual architecture · See ctloom/ for implementation details</text>
  </g>
</svg>
